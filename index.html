<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.content = s === 'dark' || s === 'light' ? s : 'light dark';
      } catch (e) {}
    </script>
    <meta name="description" content="Legendary Gravity Defied mototrial racing game - web browser port" />
    <meta name="keywords" content="gravity-defied, game, mototrial, racing, browser-game, typescript, vite, canvas, web-game, retro-game, j2me-port" />
    <title>Gravity Defied</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
